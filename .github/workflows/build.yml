name: build

on:
  push:
    branches:
      - main
      - 'phase-*'
      - 'release/v*'
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore XamppUpdater.sln
      - name: Build
        run: dotnet build XamppUpdater.sln --configuration Release --no-restore
      - name: Smoke tests
        run: dotnet run --project .\tests\XamppUpdater.Core.SmokeTests\XamppUpdater.Core.SmokeTests.csproj --configuration Release --no-build
      - name: Publish framework-dependent app payload
        run: dotnet publish .\src\XamppUpdater.App\XamppUpdater.App.csproj --configuration Release --no-restore -p:PublishProfile=win-x64 -p:AssemblyName=XAMPP-Updater.App -o .\artifacts\app-payload
      - name: Publish native bootstrap
        shell: pwsh
        run: |
          $payload = (Resolve-Path '.\artifacts\app-payload\XAMPP-Updater.App.exe').Path
          dotnet publish .\src\XamppUpdater.Bootstrap\XamppUpdater.Bootstrap.csproj --configuration Release -r win-x64 --self-contained true -p:PublishAot=true "-p:PayloadPath=$payload" -o .\artifacts\bootstrap
          if ($LASTEXITCODE -ne 0) { throw 'Native bootstrap publish failed.' }
          New-Item -ItemType Directory -Force -Path '.\artifacts\win-x64' | Out-Null
          Copy-Item '.\artifacts\bootstrap\XAMPP-Updater.exe' '.\artifacts\win-x64\XAMPP-Updater.exe' -Force
      - name: Verify published executable
        shell: pwsh
        run: |
          $exe = '.\artifacts\win-x64\XAMPP-Updater.exe'
          $payload = '.\artifacts\app-payload\XAMPP-Updater.App.exe'
          if (-not (Test-Path $exe)) { throw "Published executable not found: $exe" }
          if (-not (Test-Path $payload)) { throw "Framework-dependent payload not found: $payload" }
          $item = Get-Item $exe
          if ($item.Length -le 0) { throw 'Published executable is empty.' }
          [xml]$props = Get-Content '.\Directory.Build.props'
          $expectedVersion = [string]$props.Project.PropertyGroup.VersionPrefix
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) { throw 'VersionPrefix not found in Directory.Build.props.' }
          $version = $item.VersionInfo.ProductVersion
          if (-not $version.StartsWith($expectedVersion)) { throw "Unexpected product version: $version / expected $expectedVersion" }
          & $exe --bootstrap-self-test
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap self-test failed with exit code $LASTEXITCODE" }
          $files = @(Get-ChildItem '.\artifacts\win-x64' -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'XAMPP-Updater.exe') {
            throw "Unexpected final publish layout: $($files.Name -join ', ')"
          }
          $payloadSize = [math]::Round((Get-Item $payload).Length / 1MB, 2)
          Write-Host "Published bundle: $($item.FullName) / $([math]::Round($item.Length / 1MB, 2)) MB / payload $payloadSize MB / version $version"
      - name: Resolve release tag
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
        id: release
        shell: pwsh
        run: |
          if ($env:GITHUB_REF.StartsWith('refs/tags/v')) {
            $tag = $env:GITHUB_REF_NAME
          }
          elseif ($env:GITHUB_REF.StartsWith('refs/heads/release/v')) {
            $tag = $env:GITHUB_REF_NAME.Substring('release/'.Length)
          }
          else {
            throw "Unsupported release ref: $env:GITHUB_REF"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release tag: $tag"
      - name: Prepare release checksum
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
        shell: pwsh
        run: |
          $exe = '.\artifacts\win-x64\XAMPP-Updater.exe'
          $tag = '${{ steps.release.outputs.tag }}'
          $expectedVersion = $tag.TrimStart('v', 'V')
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          if (-not $productVersion.StartsWith($expectedVersion)) {
            throw "Tag/version mismatch: tag=$tag productVersion=$productVersion"
          }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  XAMPP-Updater.exe" | Set-Content '.\artifacts\win-x64\XAMPP-Updater.exe.sha256' -Encoding ascii
      - name: Upload win-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: XAMPP-Updater-win-x64
          path: .\artifacts\win-x64\
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $exe = '.\artifacts\win-x64\XAMPP-Updater.exe'
          $checksum = '.\artifacts\win-x64\XAMPP-Updater.exe.sha256'
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $checksum --clobber --repo '${{ github.repository }}'
          }
          else {
            gh release create $tag $exe $checksum --target '${{ github.sha }}' --title "XAMPP Updater $tag" --generate-notes --repo '${{ github.repository }}'
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publish failed for $tag" }
